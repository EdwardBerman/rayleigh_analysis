"font-size":"60px","font-weight":"700","font-style":"normal","letter-spacing":"-1.2px","line-height":"1.08","text-transform":"none","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Background: Convolutions on Graphs and Manifolds","noWrap":true,"align":"left","valign":"top"},{"id":"slide-26-div-2","x":120,"y":194.8,"w":1713.6,"h":492.16,"rot":0,"z":2,"opacity":1,"class":[],"style":{},"type":"shape","shape":"rect","fill":"rgb(227, 236, 247)","stroke":null,"strokeWidth":0,"radius":8,"path":null,"pathSize":null,"arrowStart":false,"arrowEnd":false},{"id":"slide-26-p-3","x":168,"y":230.8,"w":1623.84,"h":420.16,"rot":0,"z":3,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"38px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Definition.\u003c/b> Let $\\mathcal{G}=(V,E)$ be a graph on $n$ nodes with adjacency matrix ${\\mathbf{A}\\in\\mathbb{R}^{n\\times n}.}$ Given a node feature matrix ${\\mathbf{X}\\in\\mathbb{R}^{n\\times d_{\\rm in}}}$, where row $i$ denotes the \u003cspan style=\"white-space:nowrap\">$d_{\\rm in}$-dimensional\u003c/span> feature vector of node $i$, graph convolution operators take the general form $$f_{\\rm conv}(\\mathbf{X};\\mathbf{A}) = \\mathbf{X}\\mathbf{W}_0 + \\mathbf{A}\\mathbf{X}\\mathbf{W}_1 + \\cdots + \\mathbf{A}^k\\mathbf{X}\\mathbf{W}_k,$$where $\\mathbf{W}_0,\\dots,\\mathbf{W}_k\\in\\mathbb{R}^{d_{\\rm in}\\times d_{\\rm out}}$ are trainable parameters.","align":"left","valign":"top"},{"id":"slide-26-p-4","x":168,"y":728.95,"w":1592,"h":53.36,"rot":0,"z":4,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"34px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Remark.\u003c/b> Often only a single message passing step is included: $f_{\\rm conv}(\\mathbf{X}) = \\mathbf{A}\\mathbf{X}\\mathbf{W}$.","align":"left","valign":"top"},{"id":"slide-26-p-5","x":168,"y":800.31,"w":1592,"h":53.36,"rot":0,"z":5,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"34px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"For any permutation matrix $\\mathbf{P}_\\pi$, $\\;f_{\\rm conv}(\\mathbf{P}_\\pi\\mathbf{X};\\,\\mathbf{P}_\\pi\\mathbf{A}\\mathbf{P}_\\pi^{-1}) = \\mathbf{P}_\\pi\\, f_{\\rm conv}(\\mathbf{X};\\mathbf{A})$.","align":"left","valign":"top"},{"id":"slide-26-p-6","x":120,"y":981,"w":1460.84,"h":39,"rot":0,"z":6,"opacity":1,"class":[],"style":{"color":"rgb(102, 102, 102)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"30px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Kiani, Fesser &amp; Weber, \u003ci style=\"font-style: italic;\">Unitary Convolutions for Learning on Graphs and Groups\u003c/i>, NeurIPS 2024.","align":"left","valign":"top"}],"timeline":[]},{"id":"slide-27","name":"","background":{"color":"rgb(255, 255, 255)","image":null},"notes":"","elements":[{"id":"slide-27-h1-1","x":120,"y":80,"w":1713.6,"h":64.8,"rot":0,"z":1,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"60px","font-weight":"700","font-style":"normal","letter-spacing":"-1.2px","line-height":"1.08","text-transform":"none","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Background: Convolutions on Graphs and Manifolds","noWrap":true,"align":"left","valign":"top"},{"id":"slide-27-div-2","x":120,"y":194.8,"w":960,"h":397.59,"rot":0,"z":2,"opacity":1,"class":[],"style":{},"type":"shape","shape":"rect","fill":"rgb(227, 236, 247)","stroke":null,"strokeWidth":0,"radius":8,"path":null,"pathSize":null,"arrowStart":false,"arrowEnd":false},{"id":"slide-27-p-3","x":168,"y":230.8,"w":889.44,"h":325.59,"rot":0,"z":3,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"36px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.32","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Definition (Mesh).\u003c/b> A (triangular) mesh \u003cspan>$\\mathcal{M}$\u003c/span> consists of a set \u003cspan>$(\\mathcal{V}, \\mathcal{E}, \\mathcal{F})$\u003c/span>, where \u003cspan>$\\mathcal{V}$\u003c/span> is a set of vertices, \u003cspan>${\\mathcal{E}= \\{(i,j)\\}}$\u003c/span> is a set of ordered vertex indices \u003cspan style=\"white-space:nowrap\">\u003cspan>$i$\u003c/span>, \u003cspan>$j$\u003c/span>\u003c/span> connected by an edge, and \u003cspan>${\\mathcal{F} = \\{(i,j,k)\\}}$\u003c/span> is the set of ordered vertex indices \u003cspan style=\"white-space:nowrap\">\u003cspan>$i$\u003c/span>, \u003cspan>$j$\u003c/span>, \u003cspan>$k$\u003c/span>\u003c/span> connected by a triangular face.","align":"left","valign":"top"},{"id":"slide-27-p-4","x":168,"y":624.39,"w":912,"h":243.33,"rot":0,"z":4,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"36px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.32","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"The mesh generalizes graphs by including high order connectivity information via the inclusion of faces. We assume that the mesh is a \u003cspan style=\"white-space:nowrap\">\u003cspan>$2$\u003c/span>-dimensional\u003c/span> manifold embedded in \u003cspan>$\\mathbb{R}^3$\u003c/span>, i.e. a manifold mesh.","align":"left","valign":"top"},{"id":"slide-27-video-5","x":1120,"y":194.8,"w":330,"h":330,"rot":0,"z":5,"opacity":1,"class":[],"style":{},"type":"video","src":"assets/armadillo_turntable.88034dcb.fs.mp4","fit":"cover","autoplay":true,"loop":true,"muted":true,"controls":false,"start":0,"end":null,"poster":null,"sourceBox":null},{"id":"slide-27-video-6","x":1470,"y":194.8,"w":330,"h":330,"rot":0,"z":6,"opacity":1,"class":[],"style":{},"type":"video","src":"assets/bunny_coarse_turntable.a066f957.fs.mp4","fit":"cover","autoplay":true,"loop":true,"muted":true,"controls":false,"start":0,"end":null,"poster":null,"sourceBox":null},{"id":"slide-27-video-7","x":1120,"y":544.8,"w":330,"h":330,"rot":0,"z":7,"opacity":1,"class":[],"style":{},"type":"video","src":"assets/lucy_turntable.d6cec48a.fs.mp4","fit":"cover","autoplay":true,"loop":true,"muted":true,"controls":false,"start":0,"end":null,"poster":null,"sourceBox":null},{"id":"slide-27-video-8","x":1470,"y":544.8,"w":330,"h":330,"rot":0,"z":8,"opacity":1,"class":[],"style":{},"type":"video","src":"assets/urn_turntable.757e3ce3.fs.mp g":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Definition (Manifold Condition).\u003c/b> An interior (or boundary) edge \u003cspan>$ij$\u003c/span> is manifold if it is contained in exactly two (or one) triangles; an interior (or boundary) vertex \u003cspan>$i$\u003c/span> is manifold if the boundary of all triangles incident on \u003cspan>$i$\u003c/span> forms a single loop (or path) of edges.","align":"left","valign":"top"},{"id":"slide-33-img-4","x":1050,"y":194.8,"w":750,"h":514.28,"rot":0,"z":4,"opacity":1,"class":[],"style":{},"type":"image","src":"assets/fans_not_fins.60d0a433.png","fit":"fill","alt":"","sourceBox":null},{"id":"slide-33-p-5","x":120,"y":942,"w":1800,"h":78,"rot":0,"z":5,"opacity":1,"class":[],"style":{"color":"rgb(102, 102, 102)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"30px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Definition: Sharp &amp; Crane, \u003ci style=\"font-style: italic;\">A Laplacian for Nonmanifold Triangle Meshes\u003c/i>, CGF 2020. Figure: K. Crane, CMU 15-462/662 \u003ci style=\"font-style: italic;\">Computer Graphics\u003c/i>, Lecture 10: Meshes and Manifolds.","align":"left","valign":"top"}],"timeline":[]},{"id":"slide-76","name":"","background":{"color":"rgb(255, 255, 255)","image":null},"notes":"","elements":[{"id":"slide-76-h1-1","x":120,"y":80,"w":1713.6,"h":64.8,"rot":0,"z":1,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"60px","font-weight":"700","font-style":"normal","letter-spacing":"-1.2px","line-height":"1.08","text-transform":"none","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Background: Convolutions on Graphs and Manifolds","noWrap":true,"align":"left","valign":"top"},{"id":"slide-76-ul-2","x":120,"y":184.8,"w":1680,"h":228.75,"rot":0,"z":2,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"42px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside","padding-left":"56px"},"type":"text","html":"\u003cul>\u003cli>\u003cb style=\"font-weight: 700;\">Problem:\u003c/b> convolution sums features over a neighbourhood, but on a manifold vector signals at neighbouring vertices live in different tangent spaces \u003cspan>$T_qM \\neq T_pM$\u003c/span> and cannot simply be added. So convolution is not well defined on a manifold as it stands.\u003c/li>\u003c/ul>","align":"left","valign":"top"},{"id":"slide-76-ul-3","x":120,"y":431.55,"w":1680,"h":54.59,"rot":0,"z":3,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"42px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside","padding-left":"56px"},"type":"text","html":"\u003cul>\u003cli>\u003cb style=\"font-weight: 700;\">Solution:\u003c/b> parallel transport neighbours before aggregating\u003c/li>\u003c/ul>","align":"left","valign":"top"},{"id":"slide-76-ul-4","x":120,"y":504.14,"w":1680,"h":106.56,"rot":0,"z":4,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"38px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"circle","list-style-position":"outside","padding-left":"140px"},"type":"text","html":"\u003cul>\u003cli>Transport into the frame at \u003cspan>$p$\u003c/span>, with a steerable \u003cspan style=\"font-size: 38px; color: rgb(102, 102, 102);\">[Freeman &amp; Adelson 1991]\u003c/span> (gauge equivariant) kernel constraint \u003cspan style=\"font-size: 38px; color: rgb(102, 102, 102);\">[de Haan et al. 2021]\u003c/span>\u003c/li>\u003c/ul>","align":"left","valign":"top"},{"id":"slide-76-ul-5","x":120,"y":628.7,"w":1680,"h":98.78,"rot":0,"z":5,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"38px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"circle","list-style-position":"outside","padding-left":"140px"},"type":"text","html":"\u003cul>\u003cli>Transport in each neighbour's own reference frame, with unconstrained filters \u003cspan style=\"font-size: 38px; color: rgb(102, 102, 102);\">[Mitchel et al. 2021]\u003c/span>\u003c/li>\u003c/ul>","align":"left","valign":"top"},{"id":"slide-76-ul-6","x":120,"y":745.48,"w":1680,"h":109.19,"rot":0,"z":6,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"42px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside","padding-left":"56px"},"type":"text","html":"\u003cul>\u003cli>\u003cb style=\"font-weight: 700;\">Or ignore the issue:\u003c/b> augment traditional CNNs with surface normal vector features and distance-weighted edge weights\u003c/li>\u003c/ul>","align":"left","valign":"top"},{"id":"slide-76-p-7","x":120,"y":942,"w":1800,"h":78,"rot":0,"z":7,"opacity":1,"class":[],"style":{"color":"rgb(102, 102, 102)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"30px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Freeman &amp; Adelson, \u003ci style=\"font-style: italic;\">The Design and Use of Steerable Filters\u003c/i>, IEEE TPAMI 1991. de Haan, Weiler, Cohen &amp; Welling, \u003ci style=\"font-style: italic;\">Gauge Equivariant Mesh CNNs\u003c/i>, ICLR 2021. Mitchel, Kim &amp; Kazhdan, \u003ci style=\"font-style: italic;\">Field Convolutions for Surface CNNs\u003c/i>, ICCV 2021.","align":"left","valign":"top"}],"timeline":[]},{"id":"slide-67","name":"","background":{"color":"rgb(255, 255, 255)","image":null},"notes":"","elements":[{"id":"slide-67-h1-1","x":120,"y":80,"w":1713.6,"h":64.8,"rot":0,"z":1,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"60px","font-weight":"700","font-style":"normal","letter-spacing":"-1.2px","line-height":"1.08","text-transform":"none","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Background: Convolutions on Graphs and Manifolds","noWrap":true,"align":"left","valign":"top"},{"id":"slide-67-h2-2","x":120,"y":180.8,"w":815,"h":44,"rot":0,"z":2,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"38px","font-weight":"700", c/ul>","align":"left","valign":"top"},{"id":"slide-67-ul-10","x":985,"y":695.55,"w":815,"h":156,"rot":0,"z":10,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"30px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside","padding-left":"40px"},"type":"text","html":"\u003cul>\u003cli>Sidesteps the need for constraints on the parameters of the convolution kernel: filters are unconstrained, yet the operator still commutes with isometries.\u003c/li>\u003c/ul>","align":"left","valign":"top"},{"id":"slide-67-p-11","x":120,"y":952,"w":1800,"h":78,"rot":0,"z":11,"opacity":1,"class":[],"style":{"color":"rgb(102, 102, 102)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"30px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"de Haan, Weiler, Cohen &amp; Welling, \u003ci style=\"font-style: italic;\">Gauge Equivariant Mesh CNNs\u003c/i>, ICLR 2021 (Fig. 2, Eq. 3). Mitchel, Kim &amp; Kazhdan, \u003ci style=\"font-style: italic;\">Field Convolutions for Surface CNNs\u003c/i>, ICCV 2021 (Fig. 1).","align":"left","valign":"top"}],"timeline":[]},{"id":"slide-117","name":"","background":{"color":"rgb(255, 255, 255)","image":null},"notes":"","elements":[{"id":"slide-117-h1-1","x":120,"y":80,"w":1713.6,"h":64.8,"rot":0,"z":1,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"60px","font-weight":"700","font-style":"normal","letter-spacing":"-1.2px","line-height":"1.08","text-transform":"none","word \,\\big] \\in \\mathbb{R}^6$$\u003c/span>\u003cspan>$$\\text{e.g. } \\mathbf{h}_i = (0.00,\\,0.23,\\,0.26 \\mid 0.02,\\,-0.01,\\,1.00)$$\u003c/span>","align":"left","valign":"top"},{"id":"slide-117-p-9","x":1200,"y":502.86,"w":612,"h":170.09,"rot":0,"z":9,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"28px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Edge weights\u003c/b> from edge lengths: \u003cspan>$$w_{ij} = \\frac{1}{\\|\\mathbf{x}_i - \\mathbf{x}_j\\|}$$\u003c/span>","align":"left","valign":"top"},{"id":"slide-117-p-10","x":1200,"y":694.95,"w":612,"h":212.25,"rot":0,"z":10,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"28px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Convolution\u003c/b> is ordinary graph convolution, no transport: \u003cspan>$$\\mathbf{h}_i' = \\mathbf{W}_0\\mathbf{h}_i + \\sum_{j \\sim i} w_{ij}\\,\\mathbf{W}_1\\mathbf{h}_j$$\u003c/span>","align":"left","valign":"top"}],"timeline":[{"id":"slide-117-p-7-build-1","trigger":{"on":"click","ref":null,"delay":0},"action":{"type":"appear","target":"slide-117-p-7","value":null}},{"id":"slide-117-p-8-build-2","trigger":{"on":"click","ref":null,"delay":0},"action":{"type":"appear","target":"slide-117-p-8","value":null}},{"id":"slide-117-p-9-build-3","trigger":{"on":"click","ref":null,"delay":0},"action":{"type":"appear","target":"slide-117-p-9","value":null}},{"id":"slide-117-p-10-build-4","trigger":{"on":"click","ref":null,"delay":0},"action":{"type":"appear","target":"slide-117-p-10","value":null}}]},{"id":"slide-87","name":"","background":{"color":"rgb(255, 255, 255)","image":null},"notes":"","elements":[{"id":"slide-87-h1-1","x":120,"y":80,"w":1713.6,"h":64.8,"rot":0,"z":1,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"60px","font-weight":"700","font-style":"normal","letter-spacing":"-1.2px","line-height":"64.8px","text-transform":"none","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Background: Unitary Convolutions and Oversmoothing","noWrap":true,"align":"left","valign":"top"},{"id":"slide-87-div-2","x":120,"y":194.8,"w":1713.6,"h":693.36,"rot":0,"z":2,"opacity":1,"class":[],"style":{},"type":"shape","shape":"rect","fill":"rgb(227, 236, 247)","stroke":null,"strokeWidth":0,"radius":8,"path":null,"pathSize":null,"arrowStart":false,"arrowEnd":false},{"id":"slide-87-p-3","x":168,"y":234.8,"w":1615.68,"h":573.36,"rot":0,"z":3,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"40px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"55.2px","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Definition (Rayleigh quotient).\u003c/b> Given an undirected graph \u003cspan>${\\mathcal{G}=(V,E)}$\u003c/span> with \u003cspan>$|V|=n$\u003c/span> nodes and adjacency matrix \u003cspan>${\\mathbf{A} \\in \\{0,1\\}^{n \\times n}}$\u003c/span>, let \u003cspan>${\\mathbf{D} \\in \\mathbb{R}^{n \\times n}}$\u003c/span> be a diagonal matrix where the \u003cspan>$i$\u003c/span>-th entry \u003cspan>$\\mathbf{D}_{ii} = d_i$\u003c/span> the degree of node \u003cspan>$i$\u003c/span>. Let \u003cspan>${s \\colon V\\to\\mathbb{C}^d}$\u003c/span> be a function from nodes to features. Denote by \u003cspan>${\\tilde{\\mathbf{A}}= \\mathbf{D}^{-1/2}\\mathbf{A}\\mathbf{D}^{-1/2}}$\u003c/span> the normalized adjacency matrix and \u003cspan>${\\mathbf{X} \\in \\mathbb{C}^{n \\times d}}$\u003c/span> a matrix with the \u003cspan>$i$\u003c/span>-th row set to feature vector \u003cspan>${s(i).}$\u003c/span> The Rayleigh quotient is \u003cspan>$$R_{\\mathcal{G}}(\\mathbf{X}) = \\frac{1}{2}\\frac{\\sum_{(u, v) \\in E} \\left\\| \\frac{s(u)}{\\sqrt{d_u}} - \\frac{s(v)}{\\sqrt{d_v}}\\right\\|^2}{\\sum_{w \\in V} \\| s(w) \\|^2} = \\frac{\\operatorname{Tr}\\big(\\mathbf{X}^\\dagger(\\mathbf{I} - \\tilde{\\mathbf{A}})\\mathbf{X}\\big)}{\\|\\mathbf{X}\\|^{2}_F}.$$\u003c/span>","align":"left","valign":"top"},{"id":"slide-87-p-4","x":120,"y":942,"w":1800,"h":78,"rot":0,"z":4,"opacity":1,"class":[],"style":{"color":"rgb(102, 102, 102)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"30px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"39px","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Chung, \u003ci style=\"font-style: italic;\">Spectral Graph Theory\u003c/i>, AMS 1997. Berman, Li, Park &amp; Walters, \u003ci style=\"font-style: italic;\">Smoothness Errors in Dynamics Models and How to Avoid Them\u003c/i>, ICML 2026.","align":"left","valign":"top"}],"timeline":[]},{"id":"slide-92","name":"","background":{"color":"rgb(255, 255, 255)","image":null},"notes":"","elements":[{"id":"slide-92-h1-1","x":120,"y":80,"w":1713.6,"h":64.8,"rot":0,"z":1,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"60px","font-weight":"700","font-style":"normal","letter-spacing":"-1.2px","line-height":"1.08","text-transform":"none","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Background: Unitary Convolutions and Oversmoothing","noWrap":true,"align":"left","valign":"top"},{"id":"slide-92-div-2","x":120,"y":194.8,"w":1713.6,"h":679.75,"rot":0,"z":2,"opacity":1,"class":[],"style":{},"type":"shape","shape":"rect","fill":"rgb(227, 236, 247)","stroke":null,"strokeWidth":0,"radius":8,"path":null,"pathSize":null,"arrowStart":false,"arrowEnd":false},{"id":"slide-92-p-3","x":168,"y":234.8,"w":1615.68,"h":599.75,"rot":0,"z":3,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"42px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.38","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Unitary convolution.\u003c/b> Kiani et al. define two different models that preserve the Rayleigh quotient using unitary functions, which satisfy $\\mathbf{U}^\\dagger \\mathbf{U} = \\mathbf{I}$. In particular, they define the separable unitary convolution $$f_{\\rm UniConv}^{\\mathrm{sep}}(\\mathbf{X}; \\mathbf{A}) = \\exp(i\\mathbf{A}t)\\,\\mathbf{X}\\mathbf{U}, \\quad \\mathbf{U}^\\dagger \\mathbf{U} = \\mathbf{I}$$and the Lie unitary convolution $$f_{\\rm UniConv}^{\\mathrm{Lie}}(\\mathbf{X};\\mathbf{A}) = \\exp(\\mathbf{A}\\mathbf{X}\\mathbf{W}), \\quad \\mathbf{W} = - \\mathbf{W}^\\dagger$$where $\\exp(\\cdot)$ denotes the matrix exponential.","align":"left","valign":"top"},{"id":"slide-92-p-4","x":120,"y":942,"w":1800,"h":78,"rot":0,"z":4,"opacity":1,"class":[],"style":{"color":"rgb(102, 102, 102)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"30px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Berman, Li, Park &amp; Walters, \u003ci style=\"font-style: italic;\">Smoothness Errors in Dynamics Models and How to Avoid Them\u003c/i>, ICML 2026. Kiani, Fesser &amp; Weber, \u003ci style=\"font-style: italic;\">Unitary Convolutions for Learning on Graphs and Groups\u003c/i>, NeurIPS 2024.","align":"left","valign":"top"}],"timeline":[]},{"id":"slide-97","name":"","background":{"color":"rgb(255, 255, 255)","image":null},"notes":"","elements":[{"id":"slide-97-h1-1","x":120,"y":80,"w":1713.6,"h":64.8,"rot":0,"z":1,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"60px","font-weight":"700","font-style":"normal","letter-spacing":"-1.2px","line-height":"1.08","text-transform":"none","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Background: Unitary Convolutions and Oversmoothing","noWrap":true,"align":"left","valign":"top"},{"id":"slide-97-div-2","x":120,"y":174.8,"w":1713.6,"h":359.89,"rot":0,"z":2,"opacity":1,"class":[],"style":{},"type":"shape","shape":"rect","fill":"rgb(227, 236, 247)","stroke":null,"strokeWidth":0,"radius":8,"path":null,"pathSize":null,"arrowStart":false,"arrowEnd":false},{"id":"slide-97-p-3","x":168,"y":214.8,"w":1615.68,"h":279.89,"rot":0,"z":3,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"38px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.38","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Proposition (Invariance of Rayleigh quotient, Proposition 6 in Kiani et al.).\u003c/b> Given an undirected graph \u003cspan>$\\mathcal{G}$\u003c/span> on \u003cspan>$n$\u003c/span> nodes with normalized adjacency matrix \u003cspan>${\\widetilde{\\mathbf{A}} = \\mathbf{D}^{-1/2}\\mathbf{A}\\mathbf{D}^{-1/2}}$\u003c/span>, the Rayleigh quotient is invariant under normalized unitary or orthogonal graph convolution, i.e. \u003cspan>${R_{\\mathcal{G}}(\\mathbf{X}) = R_{\\mathcal{G}}(f_{\\rm UniConv}(\\mathbf{X}))}$\u003c/span> where \u003cspan>$f_{\\rm UniConv}$\u003c/span> is either separable or Lie.","align":"left","valign":"top"},{"id":"slide-97-img-4","x":500,"y":554.69,"w":920,"h":298.95,"rot":0,"z":4,"opacity":1,"class":[],"style":{},"type":"image","src":"assets/kiani_fig1.385e1cea.png","fit":"fill","alt":"","sourceBox":null},{"id":"slide-97-p-5","x":120,"y":859.64,"w":1680,"h":30,"rot":0,"z":5,"opacity":1,"class":[],"style":{"color":"rgb(68, 68, 68)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"26px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"normal","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Standard vs. unitary message passing on an 80-node ring graph [Kiani et al., Fig. 1]","align":"center","valign":"top"},{"id":"slide-97-p-6","x":120,"y":962,"w":1800,"h":78,"rot":0,"z":6,"opacity":1,"class":[],"style":{"color":"rgb(102, 102, 102)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"30px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Berman, Li, Park &amp; Walters, \u003ci style=\"font-style: italic;\">Smoothness Errors in Dynamics Models and How to Avoid Them\u003c/i>, ICML 2026. Kiani, Fesser &amp; Weber, \u003ci style=\"font-style: italic;\">Unitary Convolutions for Learning on Graphs and Groups\u003c/i>, NeurIPS 2024.","align":"left","valign":"top"}],"timeline":[]},{"id":"slide-104","name":"","background":{"color":null,"image":null},"notes":"","elements":[{"id":"slide-104-h1-1","x":120,"y":80,"w":1713.6,"h":64.8,"rot":0,"z":1,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"60px","font-weight":"700","font-style":"normal","letter-spacing":"-1.2px","line-height":"1.08","text-transform":"none","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Background: Unitary Convolutions and Oversmoothing","noWrap":true,"align":"left","valign":"top"},{"id":"slide-104-h2-2","x":120,"y":162.8,"w":1680,"h":44,"rot":0,"z":2,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"38px","font-weight":"700","font-style":"normal","letter-spacing":"normal","line-height":"normal","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Proof sketch: unitary convolution preserves the Rayleigh quotient","align":"left","valign":"top"},{"id":"slide-104-div-3","x":120,"y":232.8,"w":831.3,"h":654.09,"rot":0,"z":3,"opacity":1,"class":[],"style":{},"type":"shape","shape":"rect","fill":"rgb(227, 236, 247)","stroke":null,"strokeWidth":0,"radius":8,"path":null,"pathSize":null,"arrowStart":false,"arrowEnd":false},{"id":"slide-104-h2-4","x":154,"y":260.8,"w":747,"h":55.48,"rot":0,"z":4,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"36px","font-weight":"700","font-style":"normal","letter-spacing":"normal","line-height":"normal","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Separable: $\\exp(i\\tilde{\\mathbf{A}}t)\\,\\mathbf{X}\\mathbf{U}$","align":"left","valign":"top"},{"id":"slide-104-p-5","x":154,"y":330.28,"w":761.94,"h":235.92,"rot":0,"z":5,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"27px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Numerator.\u003c/b> Cyclic property of the trace, then ${\\mathbf{U}\\mathbf{U}^\\dagger = \\mathbf{I}:}$ $$\\begin{aligned}&amp;\\operatorname{Tr}\\!\\big((e^{i\\tilde{\\mathbf{A}}t}\\mathbf{X}\\mathbf{U})^\\dagger(\\mathbf{I}-\\tilde{\\mathbf{A}})\\,e^{i\\tilde{\\mathbf{A}}t}\\mathbf{X}\\mathbf{U}\\big)\\\\ &amp;\\quad= \\operatorname{Tr}\\!\\big(\\mathbf{X}^\\dagger e^{-i\\tilde{\\mathbf{A}}t}(\\mathbf{I}-\\tilde{\\mathbf{A}})\\,e^{i\\tilde{\\mathbf{A}}t}\\mathbf{X}\\big)\\end{aligned}$$","align":"left","valign":"top"},{"id":"slide-104-p-6","x":154,"y":580.2,"w":761.94,"h":177.17,"rot":0,"z":6,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"27px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"$e^{\\pm i\\tilde{\\mathbf{A}}t}$ and $\\mathbf{I}-\\tilde{\\mathbf{A}}$ share an eigenbasis, so they commute: $$= \\operatorname{Tr}\\!\\big(\\mathbf{X}^\\dagger(\\mathbf{I}-\\tilde{\\mathbf{A}})\\mathbf{X}\\big)$$","align":"left","valign":"top"},{"id":"slide-104-p-7","x":154,"y":771.38,"w":747,"h":87.52,"rot":0,"z":7,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"27px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Denominator.\u003c/b> $\\tilde{\\mathbf{A}}$ is symmetric, so $i\\tilde{\\mathbf{A}}t$ is skew-Hermitian and $e^{i\\tilde{\\mathbf{A}}t}$ is unitary: ${\\|e^{i\\tilde{\\mathbf{A}}t}\\mathbf{X}\\mathbf{U}\\|_F = \\|\\mathbf{X}\\|_F}$.","align":"left","valign":"top"},{"id":"slide-104-div-8","x":120,"y":232.8,"w":831.3,"h":654.09,"rot":0,"z":8,"opacity":0.6,"class":[],"style":{},"type":"shape","shape":"rect","fill":"rgb(255, 255, 255)","stroke":null,"strokeWidth":0,"radius":8,"path":null,"pathSize":null,"arrowStart":false,"arrowEnd":false},{"id":"slide-104-div-9","x":985,"y":232.8,"w":831.3,"h":654.09,"rot":0,"z":9,"opacity":1,"class":[],"style":{},"type":"shape","shape":"rect","fill":"rgb(227, 236, 247)","stroke":null,"strokeWidth":0,"radius":8,"path":null,"pathSize":null,"arrowStart":false,"arrowEnd":false},{"id":"slide-104-h2-10","x":1019,"y":260.8,"w":747,"h":53.48,"rot":0,"z":10,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"36px","font-weight":"700","font-style":"normal","letter-spacing":"normal","line-height":"normal","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Lie: $\\exp(\\tilde{\\mathbf{A}}\\mathbf{X}\\mathbf{W})$, $\\;\\mathbf{W}=-\\mathbf{W}^\\dagger$","align":"left","valign":"top"},{"id":"slide-104-p-11","x":1019,"y":328.28,"w":761.94,"h":136.78,"rot":0,"z":11,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"27px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Kronecker property.\u003c/b> Acting on $\\operatorname{vec}(\\mathbf{X}) \\in \\mathbb{C}^{nd}$: $$\\operatorname{vec}\\big(\\exp(\\tilde{\\mathbf{A}}\\mathbf{X}\\mathbf{W})\\big) = \\exp\\!\\big(\\tilde{\\mathbf{A}} \\otimes \\mathbf{W}^T\\big)\\operatorname{vec}(\\mathbf{X})$$","align":"left","valign":"top"},{"id":"slide-104-p-12","x":1019,"y":479.06,"w":761.94,"h":172,"rot":0,"z":12,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"27px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Denominator.\u003c/b> The generator is skew-Hermitian, so it lies in $\\mathfrak{u}(nd)$ and the norm is preserved: $$(\\tilde{\\mathbf{A}} \\otimes \\mathbf{W}^T) + (\\tilde{\\mathbf{A}} \\otimes \\mathbf{W}^T)^\\dagger = \\tilde{\\mathbf{A}} \\otimes (\\mathbf{W}+\\mathbf{W}^\\dagger)^T = 0$$","align":"left","valign":"top"},{"id":"slide-104-p-13","x":1019,"y":665.06,"w":761.94,"h":192.52,"rot":0,"z":13,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"27px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Numerator.\u003c/b> $\\exp(\\tilde{\\mathbf{A}} \\otimes \\mathbf{W}^T)$ commutes with $\\tilde{\\mathbf{A}} \\otimes \\mathbf{I}$, so $$\\begin{aligned}&amp;\\operatorname{vec}(\\mathbf{X})^\\dagger e^{(\\tilde{\\mathbf{A}} \\otimes \\mathbf{W}^T)^\\dagger}\\big[(\\mathbf{I}-\\tilde{\\mathbf{A}})\\otimes\\mathbf{I}\\big]e^{\\tilde{\\mathbf{A}} \\otimes \\mathbf{W}^T}\\operatorname{vec}(\\mathbf{X})\\\\ &amp;\\quad= \\operatorname{vec}(\\mathbf{X})^\\dagger\\big[(\\mathbf{I}-\\tilde{\\mathbf{A}})\\otimes\\mathbf{I}\\big]\\operatorname{vec}(\\mathbf{X})\\end{aligned}$$","align":"left","valign":"top"},{"id":"slide-104-div-14","x":985,"y":232.8,"w":831.3,"h":654.09,"rot":0,"z":14,"opacity":0.6,"class":[],"style":{},"type":"shape","shape":"rect","fill":"rgb(255, 255, 255)","stroke":null,"strokeWidth":0,"radius":8,"path":null,"pathSize":null,"arrowStart":false,"arrowEnd":false},{"id":"slide-104-p-15","x":120,"y":991,"w":1679.11,"h":39,"rot":0,"z":15,"opacity":1,"class":[],"style":{"color":"rgb(102, 102, 102)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"30px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Proofs adapted from Berman, Li, Park &amp; Walters, ICML 2026 (Appendix). Kiani, Fesser &amp; Weber, NeurIPS 2024.","align":"left","valign":"top"}],"timeline":[{"id":"slide-104-div-8-build-1","trigger":{"on":"click","ref":null,"delay":0},"action":{"type":"appear","target":"slide-104-div-8","value":"dissolve"}},{"id":"slide-104-div-14-out","trigger":{"on":"withPrev","ref":null,"delay":0},"action":{"type":"disappear","target":"slide-104-div-14","value":"dissolve"}}]},{"id":"slide-129","name":"","background":{"color":"rgb(255, 255, 255)","image":null},"notes":"","elements":[{"id":"slide-129-h1-1","x":120,"y":80,"w":1713.6,"h":64.8,"rot":0,"z":1,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"60px","font-weight":"700","font-style":"normal","letter-spacing":"-1.2px","line-height":"1.08","text-transform":"none","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Background: Unitary Convolutions and Oversmoothing","noWrap":true,"align":"left","valign":"top"},{"id":"slide-129-p-3","x":120,"y":236.8,"w":1680,"h":91.28,"rot":0,"z":3,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"32px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"At initialization (orthogonal weights, random features), oversmoothing concentrates around its average and grows with \u003cspan>$\\operatorname{Tr}(\\widetilde{\\mathbf{A}}^3)$\u003c/span>, the (weighted) number of triangles in the graph.","align":"left","valign":"top"},{"id":"slide-129-div-4","x":120,"y":354.08,"w":1713.6,"h":505.33,"rot":0,"z":4,"opacity":1,"class":[],"style":{},"type":"shape","shape":"rect","fill":"rgb(227, 236, 247)","stroke":null,"strokeWidth":0,"radius":8,"path":null,"pathSize":null,"arrowStart":false,"arrowEnd":false},{"id":"slide-129-p-5","x":164,"y":390.08,"w":1623.84,"h":400.33,"rot":0,"z":5,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","fo acity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"92px","font-weight":"700","font-style":"normal","letter-spacing":"-1.84px","line-height":"1.08","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Recall: Motivation","align":"left","valign":"top"},{"id":"slide-166-ul-2","x":120,"y":239.36,"w":1680,"h":62.39,"rot":0,"z":2,"opacity":1,"class":[],"style":{"color":"rgb(136, 136, 136)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"48px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside","padding-left":"56px"},"type":"text","html":"\u003cul>\u003cli>Dynamical systems on surfaces are ubiquitous\u003c/li>\u003c/ul>","align":"left","valign":"top"},{"id":"slide-166-ul-3","x":120,"y":331.75,"w":1680,"h":62.39,"rot":0,"z":3,"opacity":1,"class":[],"style":{"color":"rgb(136, 136, 136)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"48px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside","padding-left":"56px"},"type":"text","html":"\u003cul>\u003cli>GNNs are often used to solve them\u003c/li>\u003c/ul>","align":"left","valign":"top"},{"id":"slide-166-ul-4","x":120,"y":424.14,"w":1680,"h":62.39,"rot":0,"z":4,"opacity":1,"class":[],"style":{"color":"rgb(136, 136, 136)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"48px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-trans 120,"y":80,"w":1680,"h":64.8,"rot":0,"z":1,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"60px","font-weight":"700","font-style":"normal","letter-spacing":"-1.2px","line-height":"1.08","text-transform":"none","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Theory: Overly Constrained Unitary Functions","noWrap":true,"align":"left","valign":"top"},{"id":"slide-144-h2-2","x":120,"y":162.8,"w":1680,"h":44,"rot":0,"z":2,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"38px","font-weight":"700","font-style":"normal","letter-spacing":"normal","line-height":"normal","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Problem statement","align":"left","valign":"top"},{"id":"slide-144-div-3","x":120,"y":236.8,"w":1680,"h":397.16,"rot":0,"z":3,"opacity":1,"class":[],"style":{},"type":"shape","shape":"rect","fill":"rgb(227, 236, 247)","stroke":null,"strokeWidth":0,"radius":8,"path":null,"pathSize":null,"arrowStart":false,"arrowEnd":false},{"id":"slide-144-p-4","x":164,"y":270.8,"w":1623.84,"h":293.16,"rot":0,"z":4,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"36px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.38","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Setup.\u003c/b> Let $Z = \\mathbb{C}^n$ be a domain with data probability density ${p \\colon Z \\to \\mathbb{R}}$. Let ${u\\colon \\mathbb{C}^n \\to \\mathbb{C}^n}$ be a unitary function and let ${f\\colon \\mathbb{C}^n \\to \\mathbb{C}^n}$ be the target function. Denote the regression error by $$\\operatorname{err}_{\\rm reg}(u) = \\int_{Z}p(z)\\, \\lVert u(z) - f(z)\\rVert_2^2\\,dz.$$","align":"left","valign":"top"},{"id":"slide-144-p-5","x":120,"y":667.95,"w":1680,"h":97.19,"rot":0,"z":5,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"36px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"We derive an approximation error \u003cb style=\"font-weight: 700;\">lower bound\u003c/b> to understand the approximation limits of unitary functions.","align":"left","valign":"top"},{"id":"slide-144-p-6","x":120,"y":981,"w":1600.24,"h":39,"rot":0,"z":6,"opacity":1,"class":[],"style":{"color":"rgb(102, 102, 102)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"30px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Berman, Li, Park &amp; Walters, \u003ci style=\"font-style: italic;\">Smoothness Errors in Dynamics Models and How to Avoid Them\u003c/i>, ICML 2026.","align":"left","valign":"top"}],"timeline":[{"id":"slide-144-p-5-build-1","trigger":{"on":"click","ref":null,"delay":0},"action":{"type":"appear","target":"slide-144-p-5","value":null}}]},{"id":"slide-247","name":"","background":{"color":"rgb(255, 255, 255)","image":null},"notes":"","elements":[{"id":"slide-247-h1-1","x":120,"y":80,"w":1680,"h":64.8,"rot":0,"z":1,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"60px","font-weight":"700","font-style":"normal","letter-spacing":"-1.2px","line-height":"1.08","text-transform":"none","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Theory: Overly Constrained Unitary Functions","noWrap":true,"align":"left","valign":"top"},{"id":"slide-247-h2-2","x":120,"y":162.8,"w":1680,"h":44,"rot":0,"z":2,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"38px","font-weight":"700","font-style":"normal","letter-spacing":"normal","line-height":"normal","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Preliminaries: group invariance","align":"left","valign":"top"},{"id":"slide-247-div-3","x":120,"y":226.8,"w":1680,"h":170.92,"rot":0,"z":3,"opacity":1,"class":[],"style":{},"type":"shape","shape":"rect","fill":"rgb(227, 236, 247)","stroke":null,"strokeWidth":0,"radius":8,"path":null,"pathSize":null,"arrowStart":false,"arrowEnd":false},{"id":"slide-247-p-4","x":154,"y":246.8,"w":1644.24,"h":130.92,"rot":0,"z":4,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"28px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.34","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Definition (Fundamental domain [Wang et al., Def. 4.1]).\u003c/b> Let a group $G$ act on $Z$, with orbits ${Gz = \\{gz \\colon g \\in G\\}}$. A closed subset ${F \\subset Z}$ is a fundamental domain of $G$ in $Z$ if $Z$ is the union of conjugates of $F$, ${Z = \\cup_{g \\in G}\\, gF}$, and the intersection of any two conjugates has measure zero.","align":"left","valign":"top"},{"id":"slide-247-div-5","x":120,"y":415.72,"w":1713.6,"h":260.25,"rot":0,"z":5,"opacity":1,"class":[],"style":{},"type":"shape","shape":"rect","fill":"rgb(227, 236, 247)","stroke":null,"strokeWidth":0,"radius":8,"path":null,"pathSize":null,"arrowStart":false,"arrowEnd":false},{"id":"slide-247-p-6","x":154,"y":435.72,"w":1644.24,"h":192.25,"rot":0,"z":6,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"28px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.34","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Orbit mean and variance.\u003c/b> Let ${p(Gz) = \\int_{Gz} p(z)\\,dz}$ and let ${q(z) = p(z)/p(Gz)}$ be the density on the orbit $Gz$. The mean and variance of $f$ on $Gz$ are $$\\mathbb{E}_{Gz}[f] = \\int_{Gz} q(z)\\, f(z)\\,dz, \\qquad \\mathbb{V}_{Gz}[f] = \\int_{Gz} q(z)\\, \\big\\lVert \\mathbb{E}_{Gz}[f] - f(z)\\big\\rVert_2^2\\,dz.$$","align":"left","valign":"top"},{"id":"slide-247-div-7","x":120,"y":693.97,"w":1680,"h":127.28,"rot":0,"z":7,"opacity":1,"class":[],"style":{},"type":"shape","shape":"rect","fill":"rgb(227, 236, 247)","stroke":null,"strokeWidth":0,"radius":8,"path":null,"pathSize":null,"arrowStart":false,"arrowEnd":false},{"id":"slide-247-p-8","x":154,"y":713.97,"w":1612,"h":87.28,"rot":0,"z":8,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"28px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.34","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Proposition (Wang et al., Thm. 4.8).\u003c/b> For a $G$-invariant function $h$, i.e. ${h(z) = h(gz)}$ for all ${g \\in G}$, ${z \\in Z}$, the regression error is bounded below by ${\\operatorname{err}_{\\rm reg}(h) \\geq \\int_F p(Gz)\\, \\mathbb{V}_{Gz}[f]\\,dz.}$","align":"left","valign":"top"},{"id":"slide-247-p-9","x":120,"y":1001,"w":1458.38,"h":39,"rot":0,"z":9,"opacity":1,"class":[],"style":{"color":"rgb(102, 102, 102)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"30px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Wang, Zhu, Park, Jia, Su, Platt &amp; Walters, NeurIPS 2023. Berman, Li, Park &amp; Walters, ICML 2026.","align":"left","valign":"top"}],"timeline":[{"id":"slide-247-div-3-build-1","trigger":{"on":"click","ref":null,"delay":0},"action":{"type":"appear","target":"slide-247-div-3","value":null}},{"id":"slide-247-p-4-build-2","trigger":{"on":"withPrev","ref":null,"delay":0},"action":{"type":"appear","target":"slide-247-p-4","value":null}},{"id":"slide-247-div-5-build-3","trigger":{"on":"click","ref":null,"delay":0},"action":{"type":"appear","target":"slide-247-div-5","value":null}},{"id":"slide-247-p-6-build-4","trigger":{"on":"withPrev","ref":null,"delay":0},"action":{"type":"appear","target":"slide-247-p-6","value":null}},{"id":"slide-247-div-7-build-5","trigger":{"on":"click","ref":null,"delay":0},"action":{"type":"appear","target":"slide-247-div-7","value":null}},{"id":"slide-247-p-8-build-6","trigger":{"on":"withPrev","ref":null,"delay":0},"action":{"type":"appear","target":"slide-247-p-8","value":null}}]},{"id":"slide-151","name":"","background":{"color":"rgb(255, 255, 255)","image":null},"notes":"","elements":[{"id":"slide-151-h1-1","x": -ul-3","x":120,"y":236.8,"w":1680,"h":104.72,"rot":0,"z":3,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"34px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside","padding-left":"50px"},"type":"text","html":"\u003cul>\u003cli>Unitary functions preserve norms, so \u003cspan>$\\lVert u(z)\\rVert$\u003c/span> is invariant to the action of \u003cspan>$\\mathrm{SU}(n)$\u003c/span> on each sphere \u003cspan>$S^{2n-1}$\u003c/span>.\u003c/li>\u003c/ul>","align":"left","valign":"top"},{"id":"slide-159-ul-4","x":120,"y":363.52,"w":1713.6,"h":207.34,"rot":0,"z":4,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"34px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside","padding-left":"50px"},"type":"text","html":"\u003cul>\u003cli>The reverse triangle inequality reduces to this invariant setting: \u003cspan>$$\\int_{Z}p(z)\\,\\lVert u(z) - f(z)\\rVert_2^2\\,dz \\;\\geq\\; \\int_{Z}p(z)\\big(\\lVert u(z)\\rVert - \\lVert f(z)\\rVert\\big)^2 dz.$$\u003c/span>\u003c/li>\u003c/ul>","align":"left","valign":"top"},{"id":"slide-159-ul-5","x":120,"y":592.86,"w":1680,"h":266.17,"rot":0,"z":5,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"34px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-sty ","align":"left","valign":"top"},{"id":"slide-289-ul-3","x":120,"y":256.09,"w":1680,"h":102.59,"rot":0,"z":3,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"38px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside","padding-left":"50px"},"type":"text","html":"\u003cul>\u003cli>This approximates the Laplace–Beltrami operator for the continuous manifold which the mesh discretizes\u003c/li>\u003c/ul>","align":"left","valign":"top"},{"id":"slide-289-p-4","x":588.42,"y":378.69,"w":743.15,"h":247.47,"rot":0,"z":4,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"34px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"normal","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cspan>$$\\mathcal{W}_{ij} = \\begin{cases} \\tfrac{1}{2}\\left(\\cot \\alpha_{ij} + \\cot \\beta_{ij}\\right), &amp; j \\in \\mathcal{N}(i)\\\\ -\\sum_{k \\in \\mathcal{N}(i)}\\mathcal{W}_{ik}, &amp; i = j\\\\ 0, &amp; \\text{otherwise} \\end{cases}$$\u003c/span>","align":"center","valign":"top"},{"id":"slide-289-p-5","x":461.71,"y":636.16,"w":996.57,"h":208.16,"rot":0,"z":5,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"34px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"normal","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cspan>$$R_{\\mathcal{M}}(\\mathbf{X}) = \\frac{1}{2}\\frac{\\sum_{(u, v) \\in \\mathcal{E}'} {\\color{#E07A1F}\\mathcal{W}_{uv}}\\left\\| \\frac{s(u)}{\\sqrt{d_u}} - \\frac{s(v)}{\\sqrt{d_v}}\\right\\|^2}{\\sum_{w \\in V} \\| s(w) \\|^2} = \\frac{\\operatorname{Tr}\\big(\\mathbf{X}^\\dagger \\tilde{\\mathbf{L}}\\mathbf{X}\\big)}{\\|\\mathbf{X}\\|_F^2}$$\u003c/span>","align":"center","valign":"top"},{"id":"slide-289-p-6","x":120,"y":952,"w":1800,"h":78,"rot":0,"z":6,"opacity":1,"class":[],"style":{"color":"rgb(102, 102, 102)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"30px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Berman, Li, Park &amp; Walters, \u003ci style=\"font-style: italic;\">Smoothness Errors in Dynamics Models and How to Avoid Them\u003c/i>, ICML 2026. Reuter et al., 2009.","align":"left","valign":"top"}],"timeline":[]},{"id":"slide-296","name":"","background":{"color":"rgb(255, 255, 255)","image":null},"notes":"","elements":[{"id":"slide-296-h1-1","x":120,"y":80,"w":1680,"h":64.8,"rot":0,"z":1,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"60px","font-weight":"700","font-style":"normal","letter-spacing":"-1.2px","line-height":"1.08","text-transform":"none","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Theory: Extending Unitary Convolution to Meshes","noWrap":true,"align":"left","valign":"top"},{"id":"slide-296-ul-2","x":120,"y":184.8,"w":1680,"h":57.17,"rot":0,"z":2,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"38px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside","padding-left":"50px"},"type":"text","html":"\u003cul>\u003cli>We also impose that the mesh is \u003cb style=\"font-weight: 700;\">Delaunay\u003c/b>: \u003cspan>$\\alpha_{ij} + \\beta_{ij} \\leq \\pi$\u003c/span> for every edge \u003cspan>$(i,j)$\u003c/span>\u003c/li>\u003c/ul>","align":"left","valign":"top"},{"id":"slide-296-ul-3","x":120,"y":261.97,"w":1680,"h":102.59,"rot":0,"z":3,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"38px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside","padding-left":"50px"},"type":"text","html":"\u003cul>\u003cli>For manifold and Delaunay meshes, edge weights are symmetric and off-diagonals are nonnegative\u003c/li>\u003c/ul>","align":"left","valign":"top"},{"id":"slide-296-ul-4","x":120,"y":384.56,"w":1680,"h":51.3,"rot":0,"z":4,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"38px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside","padding-left":"50px"},"type":"text","html":"\u003cul>\u003cli>This is required for consistency with the Rayleigh quotient\u003c/li>\u003c/ul>","align":"left","valign":"top"},{"id":"slide-296-p-5","x":134.62,"y":467.19,"w":830.74,"h":276.59,"rot":0,"z":5,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"38px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"normal","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cspan>$$\\mathcal{W}_{ij} = \\begin{cases} \\tfrac{1}{2}\\left(\\cot \\alpha_{ij} + \\cot \\beta_{ij}\\right), &amp; j \\in \\mathcal{N}(i)\\\\ -\\sum_{k \\in \\mathcal{N}(i)}\\mathcal{W}_{ik}, &amp; i = j\\\\ 0, &amp; \\text{otherwise} \\end{cases}$$\u003c/span>","align":"center","valign":"top"},{"id":"slide-296-img-6","x":1017.22,"y":465.86,"w":760,"h":279.27,"rot":0,"z":6,"opacity":1,"class":[],"style":{},"type":"image","src":"assets/edge_flip.6be61d91.png","fit":"fill","alt":"","sourceBox":null},{"id":"slide-296-p-7","x":120,"y":952,"w":1800,"h":78,"rot":0,"z":7,"opacity":1,"class":[],"style":{"color":"rgb(102, 102, 102)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"30px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Berman, Li, Park &amp; Walters, \u003ci style=\"font-style: italic;\">Smoothness Errors in Dynamics Models and How to Avoid Them\u003c/i>, ICML 2026. Bobenko &amp; Springborn, 2007.","align":"left","valign":"top"}],"timeline":[]},{"id":"slide-304","name":"","background":{"color":"rgb(255, 255, 255)","image":null},"notes":"","elements":[{"id":"slide-304-h1-1","x":120,"y":80,"w":1680,"h":64.8,"rot":0,"z":1,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"60px","font-weight":"700","font-style":"normal","letter-spacing":"-1.2px","line-height":"1.08","text-transform":"none","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Theory: Extending Unitary Convolution to Meshes","noWrap":true,"align":"left","valign":"top"},{"id":"slide-304-p-2","x":120,"y":184.8,"w":1680,"h":51.3,"rot":0,"z":2,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"38px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Analogously, we define mesh unitary convolution using these weights:","align":"left","valign":"top"},{"id":"slide-304-p-3","x":103.2,"y":270.09,"w":1713.6,"h":119.14,"rot":0,"z":3,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"34px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"normal","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cspan>$$\\begin{aligned} &amp;\\text{(Separable)} &amp;&amp; f_{\\rm MeshUniConv}(\\mathbf{X}; \\mathbf{A}, \\mathcal{W}) = \\exp\\!\\big(i\\,\\mathbf{D}^{-1/2}(\\mathcal{W} \\odot \\mathbf{A})\\mathbf{D}^{-1/2}\\big)\\mathbf{X}\\mathbf{U}, &amp;&amp; \\mathbf{U}\\mathbf{U}^\\dagger = \\mathbf{I}\\\\ &amp;\\text{(Lie)} &amp;&amp; f_{\\rm MeshUniConv}(\\mathbf{X}; \\mathbf{A}, \\mathcal{W}) = \\exp\\!\\big(\\mathbf{D}^{-1/2}(\\mathcal{W} \\odot \\mathbf{A})\\mathbf{D}^{-1/2}\\mathbf{X}\\mathbf{W}\\big), &amp;&amp; \\mathbf{W} + \\mathbf{W}^\\dagger = 0 \\end{aligned}$$\u003c/span>","align":"center","valign":"top"},{"id":"slide-304-p-4","x":120,"y":439.23,"w":1680,"h":51.3,"rot":0,"z":4,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"38px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"For Delaunay meshes this preserves the mesh Rayleigh quotient:","align":"left","valign":"top"},{"id":"slide-304-div-5","x":120,"y":516.53,"w":1713.6,"h":254.44,"rot":0,"z":5,"opacity":1,"class":[],"style":{},"type":"shape","shape":"rect","fill":"rgb(227, 236, 247)","stroke":null,"strokeWidth":0,"radius":8,"path":null,"pathSize":null,"arrowStart":false,"arrowEnd":false},{"id":"slide-304-p-6","x":158,"y":542.53,"w":1636.08,"h":202.44,"rot":0,"z":6,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"34px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.38","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"\u003cb style=\"font-weight: 700;\">Corollary (to Proposition 6 in Kiani et al.).\u003c/b> Given a mesh \u003cspan>$\\mathcal{M}$\u003c/span> with normalized adjacency matrix \u003cspan>${\\tilde{\\mathbf{A}} = \\mathbf{D}^{-1/2}(\\mathcal{W} \\odot \\mathbf{A})\\mathbf{D}^{-1/2}}$\u003c/span> that is manifold and Delaunay, the mesh Rayleigh quotient is invariant under normalized unitary or orthogonal graph convolution, i.e. \u003cspan>${R_{\\mathcal{M}}(\\mathbf{X}) = R_{\\mathcal{M}}(f_{\\rm MeshUniConv}(\\mathbf{X}))}$\u003c/span> where \u003cspan>$f_{\\rm MeshUniConv}$\u003c/span> is either separable or Lie.","align":"left","valign":"top"},{"id":"slide-304-p-7","x":120,"y":991,"w":1600.24,"h":39,"rot":0,"z":7,"opacity":1,"class":[],"style":{"color":"rgb(102, 102, 102)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"30px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.3","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Berman, Li, Park &amp; Walters, \u003ci style=\"font-style: italic;\">Smoothness Errors in Dynamics Models and How to Avoid Them\u003c/i>, ICML 2026.","align":"left","valign":"top"}],"timeline":[]},{"id":"slide-312","name":"","background":{"color":"rgb(255, 255, 255)","image":null},"notes":"","elements":[{"id":"slide-312-h1-1","x":120,"y":80,"w":1680,"h":64.8,"rot":0,"z":1,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"60px","font-weight":"700","font-style":"normal","letter-spacing":"-1.2px","line-height":"1.08","text-transform":"none","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside"},"type":"text","html":"Theory: Extending Unitary Convolution to Meshes","noWrap":true,"align":"left","valign":"top"},{"id":"slide-312-ul-2","x":120,"y":184.8,"w":1680,"h":102.59,"rot":0,"z":2,"opacity":1,"class":[],"style":{"color":"rgb(17, 17, 17)","font-family":"\"Helvetica Neue\", Inter, system-ui, sans-serif","font-size":"38px","font-weight":"400","font-style":"normal","letter-spacing":"normal","line-height":"1.35","text-transform":"none","white-space":"normal","word-break":"normal","overflow-wrap":"normal","list-style-type":"disc","list-style-position":"outside","padding-left":"50px"},"type":"text","html":"\u003cul>\u003cli>We can use this edge weighting scheme even if the true mesh is \u003cb style=\"font-weight: 700;\">non manifold\u003c/b> or \u003cb style=\"font-weight: 700;\">non Delaunay\u003c/b> using the \u003cb style=\"font-weight: 700;\">Robust Laplacian\u003c/b>\u003c/li>\u003c/ul>","align":"left","valign":"top"},{"id":
