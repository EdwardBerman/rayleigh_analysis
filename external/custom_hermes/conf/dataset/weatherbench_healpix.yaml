# @package _global_

dataset:
  name: weatherbench_healpix
  in_dim: ${dataset.cls.input_length}
  edge_dim: 0
  out_dim: 1
  cls:
    _target_: external.custom_hermes.dataset.weatherbench_healpix.WeatherbenchHealpix
    eras5_path: "${work_dir}/data/weatherbench/eras5"
    mesh_path: "${work_dir}/data/weatherbench/earth_mesh.vtp"
    task: "t850"
    input_length: 12

loss:
  _target_: torch.nn.MSELoss

model:
  _target_: external.hermes.src.run.pde.PDERegressor

engine:
  _target_: external.hermes.src.run.pde.PDEEngine
  device: ${device}
  disable_tqdm: false
  grad_accum_steps: 3 
