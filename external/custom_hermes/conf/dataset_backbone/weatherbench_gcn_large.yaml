# @package _global_
# Number of parameters: 527617

train:
  epochs: 100 
  batch_size: 2
  lr: 3e-4

optimizer:
  _target_: torch.optim.Adam
  lr: ${train.lr}
  weight_decay: 1e-5

backbone:
  net:
    block_dims:
      - ${dataset.in_dim}
      - 256 
      - 256
      - 256
      - 256 
      - 256
      - ${dataset.out_dim}
    final_activation: false
