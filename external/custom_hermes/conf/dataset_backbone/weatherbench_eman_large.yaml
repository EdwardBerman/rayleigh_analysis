# @package _global_

# Number of parameters: 926693

train:
  epochs: 100
  batch_size: 2
  lr: 7e-3

optimizer:
  _target_: torch.optim.Adam
  lr: ${train.lr}
  weight_decay: 1e-5


backbone:
  net:
    block_dims:
      - ${dataset.in_dim}
      - 32
      - 32
      - 32
      - ${dataset.out_dim}
    block_orders: [0, 2, 2, 2, 0]
    final_activation: false
    node_batch_size: null
    n_heads: 1 

