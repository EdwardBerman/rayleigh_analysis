# @package _global_

train:
  epochs: 1
  batch_size: 2
  lr: 1e-4

optimizer:
  _target_: torch.optim.Adam
  lr: ${train.lr}
  weight_decay: 1e-5

# params: 1039238
backbone:
  net:
    message_dims:
      - - ${dataset.in_dim}
        - 64
        - 64
        - 64
        - 64
    message_orders:
      - - 0
        - 2
        - 2
        - 2
        - 2
    update_dims:
      - - 64
        - 64
        - 64
        - ${dataset.out_dim}
    update_orders:
      - - 2
        - 2
        - 2
        - 0
    edge_dims: ${dataset.edge_dim}
    final_activation: false
    node_batch_size: null


